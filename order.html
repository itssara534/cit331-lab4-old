<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Café - Order</title>
     <script src="js/order.js" defer></script>
</head>
<body>

  <header>
    <a href="index.html">
      <img src="images/logo.svg" alt="Campus Café Logo" width="200" height="60">
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="order.html">Order</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Place Your Order</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>Contact Information</legend>
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
      </fieldset>

      <br>

      <fieldset>
        <legend>Order Details</legend>

        <label for="item">Select Item:</label>
        <select id="item" name="item" required>
          <option value="">-- Choose an item --</option>
          <option value="espresso">Espresso ($2.50)</option>
          <option value="cappuccino">Cappuccino ($3.75)</option>
          <option value="iced-latte">Iced Latte ($4.00)</option>
          <option value="muffin">Blueberry Muffin ($2.75)</option>
          <option value="croissant">Butter Croissant ($3.00)</option>
          <option value="sandwich">Chicken Sandwich ($5.50)</option>
        </select>
        <br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1" required>
        <br><br>

        <label for="instructions">Special Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="4" cols="40" placeholder="Extra sugar, oat milk, etc."></textarea>
      </fieldset>

      <br>
      <button type="submit">Submit Order</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Campus Café. All rights reserved.</p>
  </footer>

</body>
</html>
